name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar configuração pública
        env:
          SUPABASE_URL_VALUE: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL_VALUE" ] && [ -n "$SUPABASE_KEY_VALUE" ]; then
            echo "window.APP_CONFIG = { supabaseUrl: '$SUPABASE_URL_VALUE', supabaseAnonKey: '$SUPABASE_KEY_VALUE', siteUrl: 'https://emanuelgandra28.github.io/Casamento/' };" > config.js
          fi
      - name: Separar arquivos do site
        run: |
          mkdir _site
          cp index.html app.js styles.css config.js .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
